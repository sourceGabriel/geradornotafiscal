name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["develop", "main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and coverage gate
        run: ./mvnw -B clean verify

