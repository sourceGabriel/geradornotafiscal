server.port=8080
spring.application.name=geradornotafiscal

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

logging.level.root=INFO
logging.level.br.com.itau.geradornotafiscal=INFO
logging.level.org.springframework.web=INFO

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.accept-case-insensitive-enums=false

idempotencia.nota-fiscal.ttl-completed-seconds=600
idempotencia.nota-fiscal.ttl-failed-seconds=30
idempotencia.nota-fiscal.cleanup-interval-millis=30000

